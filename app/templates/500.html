{% extends "base.html" %}

{% block title %}{{ _("Server error") }}{% endblock %}

{% block content %}
<div class="card text-center">
    <div class="card-body py-5">
        <i class="fas fa-exclamation-triangle fa-3x text-danger mb-3"></i>
        <h3 class="h5">{{ _("An internal error occurred") }}</h3>
        <p class="text-muted mb-0">{{ _("The incident has been logged. Please try again or contact an administrator.") }}</p>
    </div>
</div>
{% endblock %}
