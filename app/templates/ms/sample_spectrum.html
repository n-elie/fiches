{% extends "base.html" %}

{% block content %}
    <div id="mschart-pos"></div>
    <div id="mschart-neg"></div>
{% endblock %}

{% block scripts %}
    <script src="{{ url_for('static', filename='js/echarts-6.1.0.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/mass_spectrum.js') }}"></script>
    <script nonce="{{ csp_nonce }}">
        $(document).ready(function() {

            const spectrumPos = [{
                x: 43.018,
                y: 100.0
            }, {
                x: 60.021,
                y: 62.4
            }, {
                x: 73.029,
                y: 15.8
            }, {
                x: 91.018,
                y: 8.2
            }, {
                x: 118.050,
                y: 24.1
            }, ];
            const spectrumNeg = [{
                x: 59.012,
                y: 100.0
            }, {
                x: 88.040,
                y: 41.5
            }, {
                x: 105.033,
                y: 22.7
            }, {
                x: 133.014,
                y: 12.9
            }, {
                x: 161.024,
                y: 35.6
            }, ];
            const reference = '{{ sample.reference }}';

            const i18n = {
                intensity: {{ _('Relative intensity (%%)') | tojson }},
                restoreZoom: {{ _('Restore zoom') | tojson }},
                selectAll: {{ _('Select all') | tojson }},
                clearSelection: {{ _('Clear selection') | tojson }}
            };

            const charts = [
                MassSpectrum.create('#mschart-pos', spectrumPos, {
                    title: reference + ' — ' + {{ _('Positive mode') | tojson }},
                    i18n: i18n
                }),
                MassSpectrum.create('#mschart-neg', spectrumNeg, {
                    title: reference + ' — ' + {{ _('Negative mode') | tojson }},
                    i18n: i18n
                })
            ];

            $(window).on('resize', () => charts.forEach(c => c.resize()));

            $(document).on('keydown', function(e) {
                if (e.key === 'Escape') {
                    charts.forEach(chart => chart.dispatchAction({
                        type: 'takeGlobalCursor',
                        key: 'dataZoomSelect',
                        dataZoomSelectActive: false
                    }));
                }
            });
        });
    </script>
{% endblock %}
