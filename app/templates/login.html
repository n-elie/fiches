{% extends "base.html" %}

{% block title %}{{ _("Log in") }}{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-5 col-xl-4">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <div class="text-center mb-4">
                        <i class="fas fa-sign-in-alt fa-3x text-primary mb-3"></i>
                        <h2 class="h4">{{ _("Log in") }}</h2>
                        <p class="text-muted mb-0">{{ _("Sign in with your LDAP credentials") }}</p>
                    </div>

                    <form method="post" action="{{ url_for("auth.login") }}" class="login-form">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                        <div class="mb-3">
                            <label for="username" class="form-label">
                                <i class="fas fa-user"></i> {{ _("Username") }}
                            </label>
                            <input type="text"
                                   class="form-control"
                                   id="username"
                                   name="username"
                                   required
                                   placeholder="{{ _("Enter your username") }}"
                                   autocomplete="username">
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">
                                <i class="fas fa-lock"></i> {{ _("Password") }}
                            </label>
                            <input type="password"
                                   class="form-control"
                                   id="password"
                                   name="password"
                                   required
                                   placeholder="{{ _("Enter your password") }}"
                                   autocomplete="current-password">
                        </div>

                        <div class="form-check mb-3">
                            <input type="checkbox"
                                   class="form-check-input"
                                   id="remember"
                                   name="remember">
                            <label class="form-check-label" for="remember">{{ _("Remember me") }}</label>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-sign-in-alt"></i> {{ _("Log in") }}
                            </button>
                        </div>
                    </form>

                    <div class="text-center mt-3">
                        <small class="text-muted">{{ _("Having trouble logging in? Contact the system administrator.") }}</small>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
