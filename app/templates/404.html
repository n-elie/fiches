{% extends "base.html" %}

{% block title %}404 - Page non trouvée{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm text-center">
                <div class="card-body p-5">
                    <i class="fas fa-exclamation-triangle fa-4x text-danger mb-3"></i>
                    <h1 class="display-4 text-danger fw-bold">404</h1>
                    <h2 class="h4 mb-3">Page non trouvée</h2>
                    <p class="text-muted">Désolé, la page que vous cherchez n'existe pas ou a été déplacée.</p>
                    <div class="d-flex justify-content-center gap-2 flex-wrap">
                        <a href="{{ url_for('main.index') }}" class="btn btn-primary">
                            <i class="fas fa-home"></i> Retour à l'accueil
                        </a>
                        {% if current_user.is_authenticated %}
                            <a href="{{ url_for('main.user_samples') }}" class="btn btn-outline-secondary">
                                <i class="fas fa-list"></i> Mes Échantillons
                            </a>
                        {% endif %}
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
