<div class="form-section">
	<h3>Informations de l'utilisateur</h3>

	<div class="form-row">
		<div class="form-group">
			<label for="username">Nom d'utilisateur</label>
			<input type="text" id="username" name="username"
				   value="{{ user.full_name }}" readonly disabled>
		</div>
		
		<div class="form-group">
			<label for="email">Adresse Email</label>
			<input type="email" id="email" name="email"
				   value="{{ user.email }}" readonly disabled>
		</div>

		{% set user_teams = user.get_teams() %}
		{% if user_teams and user_teams|length > 1 %}
		<div class="form-group required">
			<label for="team">Équipe <span class="required-star">*</span></label>
			<select id="team" name="team" required>
				{% if sample is defined %}
					{# Edit #}
					{% for team in user_teams %}
					<option value="{{ team }}" {% if sample.team == team %}selected{% endif %}>{{ team }}</option>
					{% endfor %}
				{% else %}
					{# Create sample #}
					{% for team in user_teams %}
					<option value="{{ team }}" {% if user.last_team_used == team %}selected{% endif %}>{{ team }}</option>
					{% endfor %}
				{% endif %}
			</select>
			<span class="help-text">Sélectionnez l'équipe associée à cette analyse</span>
		</div>
		{% elif user.teams and user_teams|length == 1 %}
		<div class="form-group">
			<label for="team">Équipe</label>
			<input type="text" id="team" name="team" 
				   value="{{ user_teams[0] }}" readonly disabled>
			<input type="hidden" name="team" value="{{ user_teams[0] }}">
		</div>
		{% else %}
		<div class="form-group">
			<label for="team">Équipe</label>
			<input type="text" id="team" name="team" 
				   value="{{ user_teams }}" readonly disabled>
		</div>
		{% endif %}
	</div>
</div>
