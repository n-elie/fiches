<div class="card mb-4">
    <div class="card-body">
        <h3 class="h5 mb-3">{{ _("User information") }}</h3>

        <div class="row g-3">
            <div class="col-md-4">
                <label for="username" class="form-label">{{ _("Username") }}</label>
                <input type="text"
                       class="form-control"
                       id="username"
                       name="username"
                       value="{{ user.full_name }}"
                       readonly
                       disabled>
            </div>

            <div class="col-md-4">
                <label for="email" class="form-label">{{ _("Email address") }}</label>
                <input type="email"
                       class="form-control"
                       id="email"
                       name="email"
                       value="{{ user.email }}"
                       readonly
                       disabled>
            </div>

            {% set user_teams = user.get_teams() %}
            {% if user_teams and user_teams|length > 1 %}
                <div class="col-md-4">
                    <label for="team" class="form-label">{{ _("Team") }} <span class="required-star">*</span></label>
                    <select id="team" name="team" class="form-select" required>
                        {% if sample is defined %}
                            {# Edit #}
                            {% for team in user_teams %}
                                <option value="{{ team }}"
                                        {% if sample.team == team %}selected{% endif %}>{{ team }}</option>
                            {% endfor %}
                        {% else %}
                            {# Create sample #}
                            {% for team in user_teams %}
                                <option value="{{ team }}"
                                        {% if user.last_team_used == team %}selected{% endif %}>{{ team }}</option>
                            {% endfor %}
                        {% endif %}
                    </select>
                    <span class="help-text">{{ _("Select the team associated with this analysis") }}</span>
                </div>
            {% elif user.teams and user_teams|length == 1 %}
                <div class="col-md-4">
                    <label for="team" class="form-label">Équipe</label>
                    <input type="text"
                           class="form-control"
                           id="team"
                           name="team"
                           value="{{ user_teams[0] }}"
                           readonly
                           disabled>
                    <input type="hidden" name="team" value="{{ user_teams[0] }}">
                </div>
            {% else %}
                <div class="col-md-4">
                    <label for="team" class="form-label">{{ _("Team") }}</label>
                    <input type="text"
                           class="form-control"
                           id="team"
                           name="team"
                           value="{{ user_teams }}"
                           readonly
                           disabled>
                </div>
            {% endif %}
        </div>
    </div>
</div>
